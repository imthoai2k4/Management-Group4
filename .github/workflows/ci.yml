name: Project CI
on:
  push:
    branches: [main, develop, 'feature/**', 'codex/**']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Validate pull request source
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
          HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$EVENT" != "pull_request" ]; then exit 0; fi
          if [ "$BASE" = "main" ]; then
            [ "$HEAD" = "develop" ] && [ "$HEAD_REPO" = "$REPO" ] || {
              echo 'Release PRs must come from develop in this repository.'; exit 1;
            }
          elif [ "$BASE" = "develop" ]; then
            case "$HEAD" in
              feature/*|codex/*) ;;
              *) echo 'Use feature/<member>/<task> for work targeting develop.'; exit 1 ;;
            esac
          fi
  node:
    name: Frontend and Node backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      JWT_SECRET: ci-test-key-only-32-characters-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json
      - run: npm ci
      - run: npm run prisma:generate
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run build
      - run: npm test
  python:
    name: Python backend
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    env:
      DATABASE_URL: sqlite:///./ci-meetings.db
      SECRET_KEY: ci-test-key-only-32-characters-minimum
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt httpx
      - run: python -m compileall -q app
      - run: python test_approvals.py
  ci:
    name: CI
    if: always()
    needs: [branch-flow, node, python]
    runs-on: ubuntu-latest
    steps:
      - name: Require all checks to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python - <<'PY'
          import json, os
          results = json.loads(os.environ['RESULTS'])
          failed = [name for name, job in results.items() if job['result'] != 'success']
          if failed:
              raise SystemExit('Failed or skipped checks: ' + ', '.join(failed))
          PY
